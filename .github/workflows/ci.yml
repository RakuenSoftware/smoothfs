name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run static checks
        run: |
          make fmt-check
          make go-vet
          make script-check
          make samba-vfs-package-check
          make runtime-harnesses-list

  go-test:
    name: Go tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

      - name: Run race tests
        run: make go-race

  kernel-build:
    name: Kernel module compile (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build smoothfs module against current Debian headers
        run: make kernel-build-debian

  dkms-package:
    name: smoothfs-dkms.deb build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build smoothfs-dkms.deb in debian:trixie
        run: |
          # Job logs need admin rights to read; on failure the tail goes into
          # an annotation, which anyone can read.
          set -o pipefail
          make dkms-package-debian 2>&1 | tee build.log || {
            echo "::error title=smoothfs-dkms package build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

  samba-vfs-package:
    name: smoothfs-samba-vfs.deb build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build smoothfs-samba-vfs.deb against Debian 13's Samba
        run: |
          # Job logs need admin rights to read; on failure the tail goes into
          # an annotation, which anyone can read.
          set -o pipefail
          make samba-vfs-package-debian 2>&1 | tee build.log || {
            echo "::error title=smoothfs-samba-vfs package build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
