name: Privileged runtime harnesses

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Runtime harness suite to run.
        required: true
        default: core
        type: choice
        options:
          - core
          - protocol
          - ops
          - all
      tests:
        description: Optional space-separated harness script names. Overrides suite when set.
        required: false
        default: ""
        type: string
      module_mode:
        description: How the runner should provide smoothfs.ko.
        required: true
        default: build-and-load
        type: choice
        options:
          - build-and-load
          - preinstalled
      fail_fast:
        description: Stop after the first failing harness.
        required: true
        default: false
        type: boolean
      arch:
        description: CPU architecture of the self-hosted runner. Selects the runner label `smoothfs-runtime-<arch>`.
        required: true
        default: arm64
        type: choice
        options:
          - amd64
          - arm64
      lower_fs:
        description: Lower-tier filesystem (sets SMOOTHFS_LOWER_FS in the harness env).
        required: true
        default: xfs
        type: choice
        options:
          - xfs
          - ext4
          - btrfs
  # Auto-trigger the core suite on every push to main that touches
  # kernel sources, the runtime harnesses, the build path, or the
  # control-plane Go code. workflow_dispatch above stays available
  # for operators who want a different suite / module_mode.
  # Defaults for the push path: suite=core, module_mode=build-and-load,
  # fail_fast=false (inlined where used as `inputs.X || '...'`). The
  # arch dimension is a matrix: push runs both arm64 and amd64,
  # workflow_dispatch runs only the operator-selected arch.
  push:
    branches:
      - main
    paths:
      - 'src/smoothfs/**'
      - 'controlplane/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/runtime-harnesses.yml'

permissions:
  contents: read

jobs:
  setup:
    name: Pick arch matrix
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.pick.outputs.arches }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            printf 'arches=["%s"]\n' "$DISPATCH_ARCH" >> "$GITHUB_OUTPUT"
          else
            printf 'arches=["amd64"]\n' >> "$GITHUB_OUTPUT"
          fi

  runtime-harnesses:
    name: Runtime harnesses (${{ matrix.arch }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.arches) }}
    runs-on: [self-hosted, linux, "smoothfs-runtime-${{ matrix.arch }}"]
    concurrency:
      group: smoothfs-runtime-${{ github.ref }}-${{ matrix.arch }}-${{ inputs.lower_fs || 'xfs' }}-${{ inputs.suite || 'core' }}
      cancel-in-progress: false
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # gh-runner workers share the host kernel (where production smoothfs
      # is already loaded) and run an older kernel than smoothfs's 6.18
      # floor, so we cannot build/insmod against the host kernel. Instead
      # boot a clean >=6.18 guest under virtme-ng/QEMU (KVM via the worker's
      # /dev/kvm), build the module against that guest kernel, and load +
      # test it inside the guest where no production smoothfs is loaded.
      - name: Install QEMU, virtme-ng and build deps
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 virtme-ng virtiofsd busybox-static zstd cpio \
            build-essential bc flex bison libelf-dev libssl-dev kmod udev \
            xfsprogs e2fsprogs python3 curl ca-certificates iproute2
          # Ubuntu mainline kernels are built with a specific gcc (e.g.
          # gcc-15); install it best-effort so the module build can match,
          # otherwise the build step falls back to the default gcc.
          sudo apt-get install -y --no-install-recommends gcc-15 \
            || echo "gcc-15 unavailable; module build will use default gcc"
          # virtme-init powers the guest off via `poweroff`, absent from the
          # minimal worker rootfs (shared into the guest); provide it via
          # busybox so a clean shutdown propagates the script's exit code.
          bb="$(command -v busybox || echo /bin/busybox)"
          sudo ln -sf "$bb" /usr/sbin/poweroff
          sudo ln -sf "$bb" /sbin/poweroff 2>/dev/null || true

      - name: Fetch a >=6.18 guest kernel
        run: |
          set -euo pipefail
          bash src/smoothfs/test/ci_fetch_guest_kernel.sh | tee /tmp/kfetch.out
          grep '^GUEST_KVER=' /tmp/kfetch.out >> "$GITHUB_ENV"

      - name: Build smoothfs.ko against the guest kernel
        run: |
          set -euxo pipefail
          # The mainline kernel records the gcc it was built with; use a
          # matching gcc-15 when present, else the default gcc. vermagic
          # does not encode the gcc version, so the module still loads.
          cc="$(command -v gcc-15 || command -v gcc)"
          make -C src/smoothfs KDIR="/lib/modules/${GUEST_KVER}/build" \
            CC="$cc" HOSTCC="$cc"
          ls -l src/smoothfs/smoothfs.ko

      # The smb_vfs_module.sh harness is the only one that needs
      # /usr/lib/<multiarch>/samba/vfs/smoothfs.so. Build it on demand for
      # suites that include it. The samba source tree at /tmp/samba-<ver>
      # is laid down by runner-setup.sh (apt-get source samba); the build
      # itself takes ~5min on amd64, longer on TCG-emulated arm64. Skip
      # entirely when the suite doesn't need it (core/ops/push) so the
      # regression gate doesn't pay the cost.
      - name: Build smoothfs Samba VFS module
        if: ${{ inputs.suite == 'protocol' || inputs.suite == 'all' || contains(inputs.tests || '', 'smb_vfs_module') }}
        run: |
          set -euo pipefail
          sudo -n bash src/smoothfs/samba-vfs/build.sh

      - name: Run runtime harnesses
        env:
          SUITE: ${{ inputs.suite || 'core' }}
          TESTS: ${{ inputs.tests || '' }}
          FAIL_FAST: ${{ inputs.fail_fast || 'false' }}
          LOWER_FS: ${{ inputs.lower_fs || 'xfs' }}
        run: |
          set -euxo pipefail
          fail_fast=0
          if [ "$FAIL_FAST" = "true" ]; then fail_fast=1; fi
          log_dir="$RUNNER_TEMP/smoothfs-runtime"
          mkdir -p "$log_dir"
          # Boot the guest kernel under KVM, sharing this checkout (rw) so the
          # freshly built .ko + harness scripts are visible. --script-sh runs
          # the command in the guest, pipes its stdout to our stdout, and
          # propagates its exit code (via the virtme.ret port) as vng's exit
          # code — so `set -e` + pipefail make this step fail iff the suite
          # fails. Env is inlined into the one-line command.
          vng --help 2>&1 | sed -n '1,8p' || true
          sudo vng --run "/boot/vmlinuz-${GUEST_KVER}" \
            --cpus 4 --memory 4G --rwdir "$PWD" --user root \
            -- env "SMOOTHFS_RUNTIME_SUITE=$SUITE" "SMOOTHFS_RUNTIME_TESTS=$TESTS" \
            "SMOOTHFS_RUNTIME_FAIL_FAST=$fail_fast" "SMOOTHFS_LOWER_FS=$LOWER_FS" \
            "SMOOTHFS_CI_WORKDIR=$PWD" bash src/smoothfs/test/ci_run_in_vm.sh \
            2>&1 | tee "$log_dir/runtime-harnesses.log"

      - name: Upload runtime harness log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoothfs-runtime-${{ matrix.arch }}-${{ inputs.lower_fs || 'xfs' }}-${{ inputs.suite || 'core' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoothfs-runtime/*.log
          if-no-files-found: ignore
